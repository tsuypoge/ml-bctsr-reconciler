<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="logo.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strike Force Template — M Lhuillier</title>

<!-- Fonts: Inter for crisp UI + IBM Plex Mono for high-density tabular precision -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #7a1212;
    --primary-dark: #4a0a0a;
    --gold: #d4af37;
    --bg-main: #f8fafc;
    --panel-bg: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
    --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-sans);
    background: #ffffff;
    color: var(--text-main);
    padding-bottom: 60px;
    -webkit-font-smoothing: antialiased;
  }

  /* Login Screen */
  #login-screen {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 9999;
  }

  .login-card {
    background: #ffffff;
    padding: 36px 40px;
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
    width: 380px;
    text-align: center;
  }

  .login-logo { height: 55px; margin-bottom: 12px; }
  .login-title { font-size: 18px; font-weight: 800; color: var(--primary); margin-bottom: 4px; }
  .login-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 24px; }

  .form-group { text-align: left; margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-weight: 700; color: #334155; margin-bottom: 6px; text-transform: uppercase; }

  .form-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    font-size: 13px;
    outline: none;
    font-family: var(--font-sans);
  }
  .form-input:focus { border-color: var(--primary); }

  .btn-login {
    width: 100%;
    background: var(--primary);
    color: #ffffff;
    border: none;
    padding: 11px;
    font-weight: 700;
    font-size: 14px;
    border-radius: var(--radius-md);
    cursor: pointer;
    margin-top: 8px;
    transition: background 0.2s;
    font-family: var(--font-sans);
  }
  .btn-login:hover { background: var(--primary-dark); }

  /* Dashboard View */
  #dashboard-view {
    max-width: 1100px;
    margin: 30px auto;
    padding: 0 20px;
  }

  .dash-header-title {
    text-align: center;
    color: #dc2626;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }

  .dash-toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    align-items: center;
  }

  .btn-toolbar {
    background: #ffffff;
    border: 1px solid #cbd5e1;
    color: #334155;
    padding: 8px 18px;
    font-size: 12.5px;
    font-weight: 600;
    border-radius: var(--radius-sm);
    cursor: pointer;
    box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-sans);
  }
  .btn-toolbar:hover { background: #f8fafc; border-color: #94a3b8; }

  .dash-table-container {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow-x: auto;
    box-shadow: var(--shadow-sm);
  }

  .dash-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .dash-table th {
    background: #f8fafc;
    color: #0f172a;
    font-size: 11.5px;
    font-weight: 700;
    padding: 14px 16px;
    border-bottom: 2px solid var(--border);
    white-space: nowrap;
    text-align: left;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .dash-table th .sort-icon { font-size: 9px; color: #94a3b8; margin-left: 4px; }

  .dash-table td {
    padding: 14px 16px;
    border-bottom: 1px solid #f1f5f9;
    color: #334155;
    vertical-align: middle;
  }
  .dash-table tr:hover { background: #f8fafc; }

  .btn-tbl-status {
    border: none;
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    color: #ffffff;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    transition: opacity 0.2s;
    font-family: var(--font-sans);
  }
  .btn-tbl-status:hover { opacity: 0.9; }

  /* Modal */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.4);
    display: none; align-items: center; justify-content: center;
    z-index: 10000;
  }
  .modal-card {
    background: #ffffff; padding: 24px; border-radius: var(--radius-lg); width: 440px;
  }
</style>
</head>
<body>

<!-- 1. LOGIN SCREEN -->
<div id="login-screen">
  <div class="login-card">
    <img src="logo.png" class="login-logo" alt="M Lhuillier" onerror="this.style.display='none';">
    <div class="login-title">M LHUILLIER AUDIT PORTAL</div>
    <div class="login-sub">Strike Force Template Authentication</div>
    
    <div class="form-group">
      <label>User ID / Employee Code</label>
      <input type="text" id="login-user" class="form-input" value="AUDITOR-516" placeholder="Enter User ID">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-pass" class="form-input" value="••••••••" placeholder="Password">
    </div>

    <button class="btn-login" onclick="doLogin()">Login to Dashboard</button>
  </div>
</div>

<!-- 2. DASHBOARD VIEW -->
<div id="dashboard-view" style="display:none;">
  <h2 class="dash-header-title">Strike Force Template</h2>

  <div class="dash-toolbar">
    <button class="btn-toolbar" onclick="createNewRecon()"><span>➕</span> New Entry</button>
  </div>

  <div class="dash-table-container">
    <table class="dash-table">
      <thead>
        <tr>
          <th>Branchname <span class="sort-icon">▲▼</span></th>
          <th>Cut-off Date <span class="sort-icon">▲▼</span></th>
          <th style="text-align:center;">Status</th>
        </tr>
      </thead>
      <tbody id="dash-tbody">
        <!-- Rows dynamically rendered -->
      </tbody>
    </table>
  </div>
</div>

<!-- NEW ENTRY MODAL -->
<div class="modal-overlay" id="new-modal">
  <div class="modal-card">
    <h3 style="font-size:16px; font-weight:700; color:var(--primary); margin-bottom:14px;">Create New Branch Recon Entry</h3>
    <div class="form-group">
      <label>Branch Name</label>
      <input type="text" id="new-branch" class="form-input" placeholder="e.g. ML Catarman">
    </div>
    <div class="form-group">
      <label>Cut-off Date / Date Covered</label>
      <input type="text" id="new-cutoff-date" class="form-input" placeholder="e.g. 06/11/2026 - 07/26/2026">
    </div>
    <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:18px;">
      <button class="btn-toolbar" onclick="closeNewModal()">Cancel</button>
      <button class="btn-toolbar" style="background:var(--primary); color:#fff; border:none;" onclick="saveNewEntry()">Save Entry</button>
    </div>
  </div>
</div>

<script>
let strikeForceEntries = [
  { branch: "ML CATARMAN", cutoffDate: "06/11/2026 - 07/26/2026", status: "In Progress" },
  { branch: "ML LILOAN 3", cutoffDate: "07/21/2026 - 07/26/2026", status: "Pending" },
  { branch: "ML COMPOSTELA", cutoffDate: "06/15/2026 - 07/26/2026", status: "Pending" },
  { branch: "ML TABACO 2", cutoffDate: "2026-07-01 - 2026-08-03", status: "In Progress" }
];

function loadEntries() {
  let saved = localStorage.getItem('ml_strikeForceEntries');
  if (saved) {
    try { strikeForceEntries = JSON.parse(saved); } catch(e){}
  }
}

function saveEntries() {
  localStorage.setItem('ml_strikeForceEntries', JSON.stringify(strikeForceEntries));
}

function doLogin() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard-view').style.display = 'block';
  loadEntries();
  renderDashboardTable();
}

function renderDashboardTable() {
  const tbody = document.getElementById('dash-tbody');
  tbody.innerHTML = '';

  strikeForceEntries.forEach((row) => {
    let statusBg = "#15803d";
    if (row.status === "In Progress") statusBg = "#d97706";
    else if (row.status === "Pending") statusBg = "#475569";

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="font-weight:700; font-size:13.5px; color:var(--text-main);">${row.branch}</td>
      <td style="font-family:var(--font-mono); color:#475569;">${row.cutoffDate}</td>
      <td style="text-align:center;">
        <button class="btn-tbl-status" style="background:${statusBg};" onclick="launchReconciler('${row.branch.replace(/'/g, "\\'")}')">
          ${row.status} ➔
        </button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function createNewRecon() {
  openNewModal();
}

function openNewModal() { document.getElementById('new-modal').style.display = 'flex'; }
function closeNewModal() { document.getElementById('new-modal').style.display = 'none'; }

function saveNewEntry() {
  let bName = document.getElementById('new-branch').value.trim();
  let cDate = document.getElementById('new-cutoff-date').value.trim();

  if (!bName) { alert("Please enter Branch Name"); return; }

  strikeForceEntries.push({
    branch: bName.toUpperCase(),
    cutoffDate: cDate || "Pending Upload",
    status: "Pending"
  });

  saveEntries();
  closeNewModal();
  renderDashboardTable();
}

function launchReconciler(branchName) {
  let activeB = branchName ? branchName.toUpperCase().trim() : "SELECT BRANCH";
  localStorage.setItem('ml_activeBranch', activeB);
  window.location.href = 'reconciler.html';
}

window.addEventListener('DOMContentLoaded', () => {
  let isLogged = sessionStorage.getItem('ml_logged_in');
  if (isLogged === 'true') {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard-view').style.display = 'block';
    loadEntries();
    renderDashboardTable();
  }
});

function doLogin() {
  sessionStorage.setItem('ml_logged_in', 'true');
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard-view').style.display = 'block';
  loadEntries();
  renderDashboardTable();
}
</script>
</body>
</html>
